name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm run typecheck
      - name: Generate static website
        run: |
          export NUXT_APP_BASE_URL="${PAGES_BASE_PATH%/}/"
          if [ -n "$DOCUMENTATION_BASE_URL" ]; then
            export NUXT_PUBLIC_DOCUMENTATION_BASE_URL="$DOCUMENTATION_BASE_URL"
          fi
          npm run generate
        env:
          DOCUMENTATION_BASE_URL: ${{ vars.NUXT_PUBLIC_DOCUMENTATION_BASE_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
