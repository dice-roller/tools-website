name: Repair converter lockfile

on:
  pull_request:
    branches: [feature/converter-layout]

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'chore/repair-converter-lockfile' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts
      - run: git diff -- package-lock.json
      - run: npm ci
      - run: npx prettier --write app/pages/converter.vue
      - run: git diff -- app/pages/converter.vue
      - run: npm run lint
      - run: npm run typecheck
