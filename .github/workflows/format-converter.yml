name: Verify converter formatting

on:
  pull_request:
    branches: [feature/converter-layout]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'chore/format-converter-functionality' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/pages/converter.vue tests/e2e/accessibility.spec.ts tests/e2e/converter.spec.ts
      - run: git diff -- app/pages/converter.vue tests/e2e/accessibility.spec.ts tests/e2e/converter.spec.ts
      - run: npm run lint
      - run: npm run typecheck
